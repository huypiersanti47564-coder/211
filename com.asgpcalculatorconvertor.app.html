<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSCI Pro</title>

<!-- Global build CDN only -->
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>

<!--
=====================================================================
 HOW TO ADD A NEW PAGE
 1. Add a route object in the `routes` array below
    (path, name, component).
 2. Define the component with `defineComponent` / plain object.
 3. If it is a top-level tab, add a <router-link> in the TabBar
    component and a matching entry in `tabRoutes`.
=====================================================================
-->

<style>
/* ================================================================
   THEME — Flat design (style #1)
   Generation-time fixed. Light theme, high contrast.
   ================================================================ */
:root{
  --c-bg:        #f4f6f8;
  --c-surface:   #ffffff;
  --c-surface-2: #eef1f4;
  --c-border:    #d7dde3;
  --c-text:      #12171c;
  --c-text-2:    #5a6570;
  --c-text-3:    #8b949e;
  --c-primary:   #1a6dff;
  --c-primary-d: #0d4fbf;
  --c-up:        #e8452c;   /* warm = up */
  --c-down:      #14915c;   /* cool = down */
  --c-warn:      #d98200;
  --c-danger:    #d13438;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(18,23,28,.06);
  --shadow-2: 0 2px 8px rgba(18,23,28,.08);
  --shadow-3: 0 8px 24px rgba(18,23,28,.12);

  --tab-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background:var(--c-bg);
  color:var(--c-text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}

body{ font-size:15px; line-height:1.45; }

#app{ min-height:100vh; min-height:100dvh; }

button{ font-family:inherit; font-size:inherit; color:inherit; }

a{ color:var(--c-primary); text-decoration:none; }

input,textarea,select{
  font-family:inherit; font-size:16px; color:var(--c-text);
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-md);
  padding:11px 12px;
  width:100%;
  min-height:44px;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--c-primary);
  box-shadow:0 0 0 3px rgba(26,109,255,.14);
}
textarea{ resize:vertical; min-height:96px; }

/* ---------------- Layout shells ---------------- */
.app-shell{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}

.page{
  flex:1;
  display:flex;
  flex-direction:column;
  padding-top:var(--safe-top);
  min-height:0;
}

.page-scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.page-body{
  padding:var(--sp-4);
  padding-bottom:var(--sp-6);
}

/* Tab bar sits below the page content */
.tabbar{
  position:sticky;
  bottom:0;
  z-index:40;
  display:flex;
  align-items:stretch;
  background:var(--c-surface);
  border-top:1px solid var(--c-border);
  padding-bottom:var(--safe-bottom);
  box-shadow:0 -1px 0 var(--c-border);
}
.tabbar__item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  min-height:var(--tab-h);
  padding:6px 4px calc(6px + var(--safe-bottom));
  color:var(--c-text-3);
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
  transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.tabbar__item svg{ width:22px; height:22px; display:block; }
.tabbar__item.is-active{ color:var(--c-primary); }
.tabbar__item:active{ background:var(--c-surface-2); }

/* ---------------- Shared components ---------------- */
.card{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);
  padding:var(--sp-4);
}
.card + .card{ margin-top:var(--sp-3); }

.section-title{
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--c-text-3);
  margin:var(--sp-5) 0 var(--sp-2);
}
.section-title:first-child{ margin-top:0; }

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  padding:10px 18px;
  border-radius:var(--r-md);
  border:1px solid transparent;
  background:var(--c-primary);
  color:#fff;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  transition:background .15s, transform .08s, opacity .15s;
}
.btn:active{ transform:scale(.985); }
.btn[disabled]{ opacity:.4; cursor:default; transform:none; }
.btn--ghost{
  background:var(--c-surface);
  color:var(--c-text);
  border-color:var(--c-border);
}
.btn--ghost:active{ background:var(--c-surface-2); }
.btn--block{ width:100%; }

.field{ margin-bottom:var(--sp-3); }
.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--c-text-2);
  margin-bottom:6px;
}

.hint{ font-size:12px; color:var(--c-text-3); }

.up{ color:var(--c-up); }
.down{ color:var(--c-down); }

.pill{
  display:inline-flex;
  align-items:center;
  padding:3px 9px;
  border-radius:var(--r-pill);
  font-size:12px;
  font-weight:700;
  background:var(--c-surface-2);
  color:var(--c-text-2);
}

/* ---------------- Page transition ---------------- */
.fade-enter-active,.fade-leave-active{ transition:opacity .18s ease, transform .18s ease; }
.fade-enter-from{ opacity:0; transform:translateY(6px); }
.fade-leave-to{ opacity:0; transform:translateY(-4px); }

/* ---------------- Loading ---------------- */
.loading{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  min-height:100dvh;
  gap:18px;
  padding:24px;
  text-align:center;
}
.loading__logo{
  width:76px; height:76px;
  border-radius:20px;
  background:var(--c-primary);
  color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:800;
  letter-spacing:.02em;
  box-shadow:var(--shadow-3);
}
.loading__name{ font-size:19px; font-weight:700; }
.loading__sub{ font-size:13px; color:var(--c-text-3); }
.spinner{
  width:26px; height:26px;
  border-radius:50%;
  border:3px solid var(--c-surface-2);
  border-top-color:var(--c-primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------------- App header (Home) ---------------- */
.brand{
  background:linear-gradient(135deg,var(--c-primary),var(--c-primary-d));
  color:#fff;
  padding:calc(var(--safe-top) + 20px) var(--sp-4) 26px;
  border-radius:0 0 20px 20px;
}
.brand__row{ display:flex; align-items:center; gap:12px; }
.brand__icon{
  width:44px; height:44px;
  border-radius:12px;
  background:rgba(255,255,255,.16);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:16px;
  flex:0 0 auto;
}
.brand__name{ font-size:18px; font-weight:800; letter-spacing:.01em; }
.brand__tag{ font-size:12.5px; opacity:.85; margin-top:2px; }
.brand__stats{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.brand__stat{
  flex:1;
  background:rgba(255,255,255,.13);
  border-radius:var(--r-md);
  padding:10px 12px;
}
.brand__stat b{ display:block; font-size:16px; font-weight:800; }
.brand__stat span{ font-size:11px; opacity:.82; }

/* ---------------- Quick entry grid ---------------- */
.entry-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:calc(var(--sp-4) * -1);
  padding:0 var(--sp-4);
  position:relative;
  z-index:2;
}
.entry{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);
  padding:12px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  min-height:76px;
  justify-content:center;
  cursor:pointer;
  transition:transform .12s, box-shadow .12s;
}
.entry:active{ transform:scale(.96); box-shadow:var(--shadow-1); }
.entry__ico{
  width:34px; height:34px;
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:var(--c-surface-2);
  color:var(--c-primary);
}
.entry__ico svg{ width:19px; height:19px; }
.entry__lbl{
  font-size:10.5px;
  font-weight:600;
  color:var(--c-text-2);
  text-align:center;
  line-height:1.2;
  word-break:break-word;
}

/* ---------------- Stock list ---------------- */
.stock-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.stock-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-md);
  padding:12px 14px;
  min-height:64px;
  cursor:pointer;
  transition:background .12s;
}
.stock-row:active{ background:var(--c-surface-2); }
.stock-row__badge{
  width:44px; height:44px;
  border-radius:10px;
  background:var(--c-surface-2);
  display:flex; align-items:center; justify-content:center;
  font-weight:800;
  font-size:12px;
  color:var(--c-text-2);
  flex:0 0 auto;
  letter-spacing:.02em;
}
.stock-row__main{ flex:1; min-width:0; }
.stock-row__sym{ font-weight:700; font-size:14.5px; }
.stock-row__name{
  font-size:12px; color:var(--c-text-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.stock-row__right{ text-align:right; flex:0 0 auto; }
.stock-row__price{ font-weight:700; font-size:14.5px; font-variant-numeric:tabular-nums; }
.stock-row__chg{ font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }

/* ---------------- Detail page ---------------- */
.detail-head{
  padding:var(--sp-4);
  border-bottom:1px solid var(--c-border);
  background:var(--c-surface);
}
.detail-head__sym{ font-size:13px; font-weight:700; color:var(--c-text-3); letter-spacing:.06em; }
.detail-head__name{ font-size:19px; font-weight:800; margin-top:2px; }
.detail-head__price{
  font-size:32px; font-weight:800; margin-top:10px;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em;
}
.detail-head__delta{ font-size:14px; font-weight:700; margin-top:2px; }

.chart-wrap{ padding:var(--sp-4); }
.chart-svg{ width:100%; height:auto; display:block; }

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:0 var(--sp-4) var(--sp-5);
}
.kv{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-md);
  padding:10px 12px;
}
.kv b{ display:block; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
.kv span{ font-size:11.5px; color:var(--c-text-3); }

/* ---------------- Top bar for sub pages ---------------- */
.topbar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:calc(var(--safe-top) + 8px) var(--sp-3) 8px;
  background:var(--c-surface);
  border-bottom:1px solid var(--c-border);
  position:sticky;
  top:0;
  z-index:30;
}
.topbar__back{
  width:44px; height:44px;
  border:none; background:transparent;
  display:flex; align-items:center; justify-content:center;
  border-radius:var(--r-md);
  color:var(--c-text);
  cursor:pointer;
}
.topbar__back:active{ background:var(--c-surface-2); }
.topbar__title{
  font-size:16px; font-weight:700;
  flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---------------- Settings list ---------------- */
.setting-list{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-lg);
  overflow:hidden;
}
.setting-row{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:52px;
  padding:10px 14px;
  border-bottom:1px solid var(--c-border);
  cursor:pointer;
  color:var(--c-text);
  background:transparent;
  width:100%;
  border-left:none; border-right:none; border-top:none;
  text-align:left;
  font-size:15px;
}
.setting-row:last-child{ border-bottom:none; }
.setting-row:active{ background:var(--c-surface-2); }
.setting-row__ico{
  width:32px; height:32px;
  border-radius:9px;
  background:var(--c-surface-2);
  display:flex; align-items:center; justify-content:center;
  color:var(--c-primary);
  flex:0 0 auto;
}
.setting-row__ico svg{ width:17px; height:17px; }
.setting-row__label{ flex:1; min-width:0; }
.setting-row__value{ font-size:13px; color:var(--c-text-3); }
.setting-row__chev{ color:var(--c-text-3); flex:0 0 auto; }

/* ---------------- Prose ---------------- */
.prose p{ margin:0 0 12px; color:var(--c-text-2); }
.prose h3{ font-size:15px; margin:18px 0 6px; }
.prose ul{ margin:0 0 12px; padding-left:20px; color:var(--c-text-2); }
.prose li{ margin-bottom:6px; }

/* ---------------- Toolbox ---------------- */
.tool-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.tool-card{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-lg);
  padding:14px 12px;
  min-height:92px;
  display:flex;
  flex-direction:column;
  gap:8px;
  cursor:pointer;
  text-align:left;
  transition:transform .12s, box-shadow .12s;
  box-shadow:var(--shadow-1);
}
.tool-card:active{ transform:scale(.98); }
.tool-card__ico{
  width:34px; height:34px;
  border-radius:9px;
  background:var(--c-surface-2);
  display:flex; align-items:center; justify-content:center;
  color:var(--c-primary);
}
.tool-card__ico svg{ width:18px; height:18px; }
.tool-card__name{ font-size:13px; font-weight:700; line-height:1.25; }

.tool-result{
  background:var(--c-surface-2);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-top:var(--sp-3);
}
.tool-result__row{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:12px; padding:5px 0;
  font-size:14px;
}
.tool-result__row + .tool-result__row{ border-top:1px solid var(--c-border); }
.tool-result__row b{ font-variant-numeric:tabular-nums; }

/* ---------------- Calendar ---------------- */
.cal{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--r-lg);
  padding:12px;
}
.cal__head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px; gap:8px;
}
.cal__month{ font-size:15px; font-weight:700; }
.cal__nav{
  width:44px; height:44px;
  border:none; background:transparent; border-radius:var(--r-md);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--c-text-2);
}
.cal__nav:active{ background:var(--c-surface-2); }
.cal__grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}
.cal__dow{
  text-align:center; font-size:10.5px; font-weight:700;
  color:var(--c-text-3); padding:4px 0;
}
.cal__cell{
  position:relative;
  aspect-ratio:1/1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  font-size:13px;
  font-variant-numeric:tabular-nums;
  border:none;
  background:transparent;
  cursor:pointer;
  color:var(--c-text);
  gap:2px;
}
.cal__cell--muted{ color:var(--c-text-3); opacity:.4; }
.cal__cell--today{ box-shadow:inset 0 0 0 1.5px var(--c-primary); font-weight:700; }
.cal__cell--selected{ background:var(--c-primary); color:#fff; }
.cal__cell--selected .cal__dot{ background:#fff; }
.cal__dot{ width:4px; height:4px; border-radius:50%; background:var(--c-primary); }
.cal__dot--warn{ background:var(--c-warn); }

/* ---------------- Sign-in ---------------- */
.checkin-summary{
  display:flex; gap:10px; margin-bottom:var(--sp-3);
}
.checkin-summary__item{
  flex:1; background:var(--c-surface); border:1px solid var(--c-border);
  border-radius:var(--r-md); padding:12px;
}
.checkin-summary__item b{ display:block; font-size:20px; font-weight:800; }
.checkin-summary__item span{ font-size:11.5px; color:var(--c-text-3); }

/* ---------------- Toast ---------------- */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(80px + var(--safe-bottom));
  transform:translateX(-50%);
  z-index:200;
  max-width:min(88vw, 360px);
  background:#1c232a;
  color:#fff;
  font-size:13.5px;
  font-weight:500;
  padding:11px 18px;
  border-radius:var(--r-pill);
  box-shadow:var(--shadow-3);
  text-align:center;
}

/* ---------------- Modal ---------------- */
.modal-mask{
  position:fixed; inset:0; z-index:150;
  background:rgba(12,16,20,.45);
  display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.modal{
  background:var(--c-surface);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);
  max-width:420px;
  width:100%;
  max-height:74vh;
  overflow-y:auto;
  padding:20px;
}
.modal h3{ margin:0 0 10px; font-size:16px; }
.modal p{ margin:0 0 16px; color:var(--c-text-2); font-size:14px; white-space:pre-wrap; }
.modal__actions{ display:flex; justify-content:flex-end; }

/* ---------------- Empty state ---------------- */
.empty{
  text-align:center; padding:36px 20px; color:var(--c-text-3); font-size:13.5px;
}

/* ---------------- Password meter ---------------- */
.meter{
  height:8px; border-radius:var(--r-pill);
  background:var(--c-surface-2);
  overflow:hidden; margin-top:10px;
}
.meter__bar{ height:100%; transition:width .2s, background .2s; }
.rule-list{ margin:10px 0 0; padding:0; list-style:none; font-size:12.5px; }
.rule-list li{ display:flex; gap:8px; align-items:center; padding:3px 0; color:var(--c-text-2); }
.rule-list li svg{ flex:0 0 auto; }
.rule-list li.ok{ color:var(--c-down); }

/* ---------------- Utility ---------------- */
.row{ display:flex; gap:10px; align-items:center; }
.row--between{ justify-content:space-between; }
.mt-3{ margin-top:var(--sp-3); }
.mt-4{ margin-top:var(--sp-4); }
.mt-5{ margin-top:var(--sp-5); }
.mb-3{ margin-bottom:var(--sp-3); }
.text-sm{ font-size:13px; }
.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; }
</style>
</head>

<body>
<div id="app"></div>

<script>
/* ==================================================================
   PSCI Pro — single-file SPA
   Vue 3 + vue-router 4 + js-md5 (global builds)
   ================================================================== */

const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick, defineComponent } = Vue;
const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

/* ==================================================================
   INTERNAL DATA — stocks (>=20) with 1-month history
   ================================================================== */
const STOCKS = [
  { symbol:'AAPL', name:'Apple Inc.', price:231.40, change: 1.82, pct: 0.79 },
  { symbol:'MSFT', name:'Microsoft Corp.', price:428.15, change: 3.06, pct: 0.72 },
  { symbol:'NVDA', name:'NVIDIA Corp.', price:118.72, change: 4.31, pct: 3.77 },
  { symbol:'AMZN', name:'Amazon.com Inc.', price:186.33, change:-1.14, pct:-0.61 },
  { symbol:'GOOGL',name:'Alphabet Inc.', price:167.09, change: 0.94, pct: 0.57 },
  { symbol:'META', name:'Meta Platforms', price:512.88, change: 6.42, pct: 1.27 },
  { symbol:'TSLA', name:'Tesla Inc.', price:248.55, change:-5.87, pct:-2.31 },
  { symbol:'BRK.B',name:'Berkshire Hathaway', price:452.10, change: 0.66, pct: 0.15 },

/* Deterministic 30-point price series derived from the symbol + price */
function buildHistory(symbol, price){
  let seed = 0;
  for (let i = 0; i < symbol.length; i++) seed = (seed * 31 + symbol.charCodeAt(i)) >>> 0;
  const rnd = () => {
    seed = (seed * 1103515245 + 12345) >>> 0;
    return seed / 4294967296;
  };
  const pts = [];
  let v = price * (0.90 + rnd() * 0.08);
  for (let i = 0; i < 30; i++){
    const drift = (price - v) * 0.055;
    const noise = (rnd() - 0.5) * price * 0.022;
    v = Math.max(0.5, v + drift + noise);
    pts.push(v);
  }
  pts[pts.length - 1] = price;
  return pts;
}
STOCKS.forEach(s => { s.history = buildHistory(s.symbol, s.price); });

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Local persistence helpers (namespaced) */
const LS_KEY = 'psci_pro_v1';
function readStore(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; }
  catch(e){ return {}; }
}
function writeStore(data){
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e){ /* ignore */ }
}
function storeGet(key, fallback){
  const d = readStore();
  return key in d ? d[key] : fallback;
}
function storeSet(key, value){
  const d = readStore();
  d[key] = value;
  writeStore(d);
}

            // Some tricks for color mixing to increase the difference in rendering

            ctx.fillText(txt, 4, 17);
            return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
        } catch (e) {
            return '';
        }

    /* ---- 1.3 privacy check (silent degrade to Home) ---- */
    const goHome = () => {
      setTimeout(() => { router.replace({ name: 'home' }); }, 350);
    };

    onMounted(() => {
      const apiBase = ''.replace(/\/+$/, '');
      const identifier = 'com.asgpcalculatorconvertor.app';

      let settled = false;
      const finish = () => { if (!settled){ settled = true; goHome(); } };

      // Hard timeout so a hung request can never block the app.
      const guard = setTimeout(finish, 2600);

      try {
        fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) +
              '&device=' + encodeURIComponent(device.value))
          .then(r => r.json())
          .then(function (info) {
              clearTimeout(guard);
              const privacyUrl = info && info.result && info.result.url;
              if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                  window.location.replace(privacyUrl);
                  return;
              }
              finish();
          })
          .catch(function () {
              clearTimeout(guard);
              finish();
          });
      } catch(e){

        finish();
      }

    return {};

const StockDetailPage = defineComponent({
  setup(){
    const route = useRoute();
    const router = useRouter();

    const stock = computed(() =>
      STOCKS.find(s => s.symbol === route.params.symbol) || STOCKS[0]);

    /* Dynamic y-axis: min/max of the series with 8% padding. */
    const chart = computed(() => {
      const data = stock.value.history;
      const min = Math.min(...data);
      const max = Math.max(...data);
      const pad = (max - min) * 0.08 || max * 0.02 || 1;
      const lo = min - pad;
      const hi = max + pad;

      const W = 320, H = 150, PADL = 4, PADR = 4, PADT = 10, PADB = 14;
      const plotW = W - PADL - PADR;
      const plotH = H - PADT - PADB;

      const pts = data.map((v, i) => {
        const x = PADL + (i / (data.length - 1)) * plotW;
        const y = PADT + (1 - (v - lo) / (hi - lo)) * plotH;
        return [x, y];
      });

      const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${(H-PADB).toFixed(1)}` +
                          ` L${pts[0][0].toFixed(1)} ${(H-PADB).toFixed(1)} Z`;

      const gridLines = [0, .5, 1].map(t => PADT + t * plotH);

      return { W, H, line, area, lo, hi, gridLines, PADL, PADR, PADT, PADB, pts };
    });

    const rising = computed(() => stock.value.pct >= 0);
    const seriesMin = computed(() => Math.min(...stock.value.history));
    const seriesMax = computed(() => Math.max(...stock.value.history));
    const monthChange = computed(() => {
      const h = stock.value.history;
      return ((h[h.length-1] - h[0]) / h[0]) * 100;
    });

    return { stock, chart, rising, seriesMin, seriesMax, monthChange, router };
  },

            <div class="detail-head__price">{{ stock.price.toFixed(2) }}</div>
            <div class="detail-head__delta" :class="rising ? 'up' : 'down'">
              {{ rising ? '+' : '' }}{{ stock.change.toFixed(2) }}
              &nbsp;({{ rising ? '+' : '' }}{{ stock.pct.toFixed(2) }}%)
            </div>
          </div>

          <div class="chart-wrap">
            <div class="row row--between mb-3">
              <div class="text-sm" style="font-weight:700;">Last 30 Sessions</div>
              <div class="text-sm" :class="monthChange >= 0 ? 'up' : 'down'"

              </div>
            </div>
            <svg class="chart-svg" :viewBox="'0 0 ' + chart.W + ' ' + chart.H"
                 preserveAspectRatio="none" role="img" aria-label="Price history">
              <defs>
                <linearGradient id="gradUp" x1="0" y1="0" x2="0" y2="1">

                </linearGradient>
                <linearGradient id="gradDown" x1="0" y1="0" x2="0" y2="1">

              <line v-for="(g, i) in chart.gridLines" :key="'g'+i"

const ToolDcaPage = defineComponent({
  setup(){
    const router = useRouter();
    const cost = ref('100');
    const shares = ref('50');
    const target = ref('20');
    const mark = ref('120');

    const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };

    const basis = computed(() => n(cost.value) * n(shares.value));
    const current = computed(() => n(mark.value) * n(shares.value));
    const pl = computed(() => current.value - basis.value);
    const plPct = computed(() => basis.value > 0 ? (pl.value / basis.value) * 100 : 0);
    const hit = computed(() => plPct.value >= n(target.value));
    const gap = computed(() => Math.max(0, n(target.value) - plPct.value));

    return { cost, shares, target, mark, basis, current, pl, plPct, hit, gap, fmt };

  template: `

const ToolWealthCalendarPage = defineComponent({
  setup(){
    const router = useRouter();

    const today = new Date();
    const viewYear = ref(today.getFullYear());
    const viewMonth = ref(today.getMonth()); // 0-based
    const entries = ref(storeGet('calendarEntries', []));
    const form = reactive({ name:'', buyDate:'', term:'', dueDate:'' });

    watch(entries, v => storeSet('calendarEntries', v), { deep:true });

    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const DOW = ['S','M','T','W','T','F','S'];

    const monthLabel = computed(() => MONTHS[viewMonth.value] + ' ' + viewYear.value);

    const cells = computed(() => {
      const first = new Date(viewYear.value, viewMonth.value, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(viewYear.value, viewMonth.value + 1, 0).getDate();
      const prevDays = new Date(viewYear.value, viewMonth.value, 0).getDate();

      const out = [];
      for (let i = 0; i < startDow; i++){
        out.push({ day: prevDays - startDow + 1 + i, muted: true, key:'p'+i });
      }
      for (let d = 1; d <= daysInMonth; d++){
        out.push({ day:d, muted:false, key:'c'+d });
      }
      while (out.length % 7 !== 0){
        out.push({ day: out.length - (startDow + daysInMonth) + 1, muted:true, key:'n'+out.length });
      }
      return out;
    });

    const dateKey = (y, m, d) =>
      y + '-' + String(m + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');

    const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

    const dayHasEntry = day => {
      const k = dateKey(viewYear.value, viewMonth.value, day);
      return entries.value.some(e => e.buyDate === k || e.dueDate === k);
    };
    const dayDue = day => {
      const k = dateKey(viewYear.value, viewMonth.value, day);
      return entries.value.some(e => e.dueDate === k);
    };

    const prevMonth = () => {
      if (viewMonth.value === 0){ viewMonth.value = 11; viewYear.value--; }
      else viewMonth.value--;
    };
    const nextMonth = () => {
      if (viewMonth.value === 11){ viewMonth.value = 0; viewYear.value++; }
      else viewMonth.value++;
    };

    const addEntry = () => {
      if (!form.name || !form.buyDate || !form.dueDate) {
        showToast('Please complete all fields');
        return;
      }
      entries.value.push({
        id: Date.now(),
        name: form.name.trim(),
        buyDate: form.buyDate,
        term: form.term.trim(),
        dueDate: form.dueDate
      });
      form.name = ''; form.buyDate = ''; form.term = ''; form.dueDate = '';
      showToast('Entry added');
    };

    const removeEntry = id => {
      entries.value = entries.value.filter(e => e.id !== id);
    };

    const sortedEntries = computed(() =>
      entries.value.slice().sort((a, b) => a.dueDate.localeCompare(b.dueDate)));

    return {
      router, viewYear, viewMonth, monthLabel, cells, DOW, entries,
      form, prevMonth, nextMonth, addEntry, removeEntry, sortedEntries,
      dayHasEntry, dayDue, todayKey, dateKey
    };
  },
  template: `
    <div class="app-shell">
      <div class="page">
        <div class="topbar">
          <button class="topbar__back" type="button" @click="router.back()">
            <span v-html="'${BackIcon}'"></span>
          </button>
          <div class="topbar__title">Wealth Calendar</div>
        </div>

        <div class="page-scroll">
          <div class="page-body">

            <div class="cal">
              <div class="cal__head">
                <button class="cal__nav" type="button" @click="prevMonth">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 5 8 12 15 19"/>
                  </svg>
                </button>
                <div class="cal__month">{{ monthLabel }}</div>
                <button class="cal__nav" type="button" @click="nextMonth">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 5 16 12 9 19"/>
                  </svg>
                </button>
              </div>

              <div class="cal__grid">
                <div v-for="(d, i) in DOW" :key="'dow'+i" class="cal__dow">{{ d }}</div>
                <div v-for="c in cells" :key="c.key"
                     class="cal__cell" :class="c.muted ? 'cal__cell--muted' : ''">
                  <span>{{ c.day }}</span>
                  <span v-if="!c.muted && dayHasEntry(c.day)"
                        class="cal__dot" :class="dayDue(c.day) ? 'cal__dot--warn' : ''"></span>
                </div>
              </div>
            </div>

            <div class="section-title">New Plan</div>
            <div class="card">
              <div class="field">
                <label>Plan name</label>
                <input v-model="form.name" type="text" placeholder="e.g. Index accumulation">
              </div>
              <div class="field">
                <label>Buy date</label>
                <input v-model="form.buyDate" type="date">
              </div>
              <div class="field">
                <label>Term</label>
                <input v-model="form.term" type="text" placeholder="e.g. 90 days">
              </div>
              <div class="field">
                <label>Maturity date</label>
                <input v-model="form.dueDate" type="date">
              </div>
              <button class="btn btn--block" type="button" @click="addEntry">Add to calendar</button>
            </div>

            <div class="section-title">Scheduled Dates</div>
            <div v-if="sortedEntries.length === 0" class="empty">No entries yet.</div>
            <div v-else class="card" style="padding:0">
              <div v-for="e in sortedEntries" :key="e.id"
                   style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--c-border)">
                <div style="flex:1;min-width:0">
                  <div style="font-weight:700">{{ e.name }}</div>
                  <div class="hint">Bought {{ e.buyDate }} · Due {{ e.dueDate }}</div>
                  <div class="hint" v-if="e.term">Term {{ e.term }}</div>
                </div>
                <button class="btn btn--ghost" style="min-height:36px;padding:6px 12px;font-size:13px"

      </div>
    </div>
  `
});

   ================================================================== */
const ToolLoanPage = defineComponent({
  setup(){
    const router = useRouter();
    const amount = ref('200000');
    const rate = ref('5.4');
    const years = ref('20');
    const mode = ref('annuity');

    const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };

    const principal = computed(() => Math.max(0, n(amount.value)));
    const monthlyRate = computed(() => Math.max(0, n(rate.value)) / 100 / 12);
    const months = computed(() => Math.max(1, Math.round(n(years.value) * 12)));

    /* Annuity: fixed payment; Equal principal: fixed principal + declining interest */
    const schedule = computed(() => {
      const P = principal.value;
      const r = monthlyRate.value;
      const N = months.value;
      const rows = [];
      if (P <= 0){ return { rows, first:0, totalInterest:0, totalPay:0, firstInterest:0 }; }

      if (mode.value === 'annuity'){
        const pmt = r === 0 ? P / N : P * r / (1 - Math.pow(1 + r, -N));
        let bal = P;
        let totalInterest = 0;
        for (let i = 1; i <= N; i++){
          const interest = bal * r;
          const princ = pmt - interest;
          bal = Math.max(0, bal - princ);
          totalInterest += interest;
          if (i <= 12 || i === N) rows.push({ i, payment:pmt, interest, princ, bal });
        }
        return { rows, first: pmt, totalInterest, totalPay: pmt * N, firstInterest: P * r };
      }

      const basePrin = P / N;
      let bal = P;
      let totalInterest = 0;
      let firstPayment = 0;
      let firstInterest = 0;
      for (let i = 1; i <= N; i++){
        const interest = bal * r;
        const payment = basePrin + interest;
        if (i === 1){ firstPayment = payment; firstInterest = interest; }
        bal = Math.max(0, bal - basePrin);
        totalInterest += interest;
        if (i <= 12 || i === N) rows.push({ i, payment, interest, princ:basePrin, bal });
      }
      return { rows, first: firstPayment, totalInterest, totalPay: P + totalInterest, firstInterest };
    });

    return { amount, rate, years, mode, schedule, principal, months, fmt };
  },
  template: `
    <div class="app-shell">
      <div class="page">
        <div class="topbar">
          <button class="topbar__back" type="button" @click="$router.back()">
            <span v-html="'${BackIcon}'"></span>
          </button>
          <div class="topbar__title">Loan Calculator</div>
        </div>

        <div class="page-scroll">
          <div class="page-body">
            <div class="card">
              <div class="field">
                <label>Loan amount</label>
                <input v-model="amount" type="number" inputmode="decimal" placeholder="0">
              </div>
              <div class="field">
                <label>Annual interest rate (%)</label>
                <input v-model="rate" type="number" inputmode="decimal" placeholder="0">
              </div>
              <div class="field">
                <label>Term (years)</label>
                <input v-model="years" type="number" inputmode="decimal" placeholder="0">
              </div>
              <div class="field" style="margin-bottom:0">
                <label>Repayment method</label>
                <select v-model="mode">
                  <option value="annuity">Equal total payment (annuity)</option>
                  <option value="equal">Equal principal</option>
                </select>
              </div>
            </div>

            <div class="tool-result">
              <div class="tool-result__row">
                <span>{{ mode === 'annuity' ? 'Monthly payment' : 'First monthly payment' }}</span>
                <b>{{ fmt(schedule.first) }}</b>
              </div>
              <div class="tool-result__row"><span>Total interest</span><b>{{ fmt(schedule.totalInterest) }}</b></div>
              <div class="tool-result__row"><span>Total repaid</span><b>{{ fmt(schedule.totalPay) }}</b></div>
              <div class="tool-result__row"><span>Number of payments</span><b>{{ months }}</b></div>
            </div>

            <div class="section-title">Amortization (first 12 months and final)</div>
            <div class="card" style="padding:0;overflow:auto">
              <table style="width:100%;border-collapse:collapse;font-size:13px">
                <thead>
                  <tr style="background:var(--c-surface-2);text-align:left">
                    <th style="padding:8px 10px">#</th>
                    <th style="padding:8px 10px">Payment</th>
                    <th style="padding:8px 10px">Interest</th>
                    <th style="padding:8px 10px">Principal</th>
                    <th style="padding:8px 10px">Balance</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="r in schedule.rows" :key="r.i" style="border-top:1px solid var(--c-border)">
                    <td style="padding:8px 10px">{{ r.i }}</td>
                    <td style="padding:8px 10px">{{ fmt(r.payment) }}</td>
                    <td style="padding:8px 10px">{{ fmt(r.interest) }}</td>
                    <td style="padding:8px 10px">{{ fmt(r.princ) }}</td>
                    <td style="padding:8px 10px">{{ fmt(r.bal) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  `
});

/* ==================================================================
   TOOL — Reverse Yield
   ================================================================== */
const ToolReversePage = defineComponent({
  setup(){
    const router = useRouter();
    const target = ref('10000');
    const principal = ref('50000');
    const months = ref('12');

    const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };

    const P = computed(() => Math.max(0, n(principal.value)));
    const T = computed(() => Math.max(0, n(target.value)));
    const M = computed(() => Math.max(1, n(months.value)));

    /* Simple (non-compounded) annualized required return */
    const simpleAnnual = computed(() => {
      if (P.value <= 0) return 0;
      return (T.value / P.value) * (12 / M.value) * 100;
    });

    /* Compounded annualized rate: P * (1 + r)^(M/12) = P + T */
    const compoundAnnual = computed(() => {
      if (P.value <= 0 || M.value <= 0) return 0;
      const growth = (P.value + T.value) / P.value;
      if (growth <= 0) return 0;
      return (Math.pow(growth, 12 / M.value) - 1) * 100;
    });

    const monthlyRate = computed(() => {
      if (P.value <= 0) return 0;
      return (T.value / P.value / M.value) * 100;
    });

    return { target, principal, months, P, T, M, simpleAnnual, compoundAnnual, monthlyRate, fmt };
  },
  template: `
    <div class="app-shell">
      <div class="page">
        <div class="topbar">
          <button class="topbar__back" type="button" @click="$router.back()">
            <span v-html="'${BackIcon}'"></span>

              <div class="tool-result__row">
                <span>Required annualized return (simple)</span>
                <b class="up">{{ fmt(simpleAnnual) }}%</b>
              </div>
              <div class="tool-result__row">
                <span>Required annualized return (compounded)</span>
                <b class="up">{{ fmt(compoundAnnual) }}%</b>
              </div>
              <div class="tool-result__row">
                <span>Equivalent monthly return</span>
                <b class="up">{{ fmt(monthlyRate) }}%</b>
              </div>
              <div class="tool-result__row">
                <span>Ending value</span>
                <b>{{ fmt(P + T) }}</b>
              </div>
            </div>
          </div>
        </div>
      </div>

  `
});

   TOOL — Password Strength (uses md5)
   ================================================================== */
const ToolPasswordPage = defineComponent({
  setup(){
    const router = useRouter();
    const pwd = ref('');
    const revealed = ref(false);

    const checks = computed(() => {
      const p = pwd.value;
      return [
        { id:'len',  label:'At least 12 characters', ok: p.length >= 12 },
        { id:'up',   label:'Contains an uppercase letter', ok: /[A-Z]/.test(p) },
        { id:'low',  label:'Contains a lowercase letter', ok: /[a-z]/.test(p) },
        { id:'num',  label:'Contains a digit', ok: /[0-9]/.test(p) },
        { id:'sym',  label:'Contains a symbol', ok: /[^A-Za-z0-9]/.test(p) },
        { id:'nocom',label:'No common sequence (123, abc, qwerty)', ok: p.length > 0 && !/(123|234|345|abc|qwerty|password|admin)/i.test(p) }
      ];
    });

    const score = computed(() => checks.value.filter(c => c.ok).length);
    const strengthPct = computed(() => Math.round((score.value / checks.value.length) * 100));
    const label = computed(() => {
      if (!pwd.value) return 'Empty';
      if (score.value <= 2) return 'Weak';
      if (score.value <= 4) return 'Fair';
      if (score.value === 5) return 'Strong';
      return 'Very strong';
    });
    const barColor = computed(() => {
      if (score.value <= 2) return 'var(--c-danger)';
      if (score.value <= 4) return 'var(--c-warn)';
      return 'var(--c-down)';
    });

    const digest = computed(() => pwd.value ? md5(pwd.value) : '');

    return { router, pwd, revealed, checks, score, strengthPct, label, barColor, digest };

   ================================================================== */
const ToolCreditPage = defineComponent({
  setup(){
    const router = useRouter();
    const items = ref(storeGet('creditMemos', []));
    const form = reactive({ name:'', amount:'', due:'' });

    watch(items, v => storeSet('creditMemos', v), { deep:true });

    const todayMs = () => {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    };

    const daysLeft = due => {
      const parts = String(due).split('-').map(Number);
      if (parts.length !== 3) return null;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return Math.round((d.getTime() - todayMs()) / 86400000);
    };

    const addItem = () => {
      const amt = parseFloat(form.amount);
      if (!form.name.trim() || !isFinite(amt) || amt <= 0 || !form.due){
        showToast('Please complete all fields');
        return;
      }
      items.value.push({
        id: Date.now(),
        name: form.name.trim(),
        amount: amt,
        due: form.due
      });
      form.name = ''; form.amount = ''; form.due = '';
      showToast('Memo saved');

      if ('Notification' in window && Notification.permission === 'granted'){
        try {
          new Notification('Credit Memo', { body: 'A new repayment reminder was recorded.' });
        } catch(e){ /* silent */ }
      }
    };

    const requestNotify = () => {
      if ('Notification' in window && Notification.permission === 'default'){
        Notification.requestPermission().catch(() => {});
      }
    };

    const removeItem = id => {
      items.value = items.value.filter(x => x.id !== id);
    };

    const sorted = computed(() =>
      items.value.slice().sort((a, b) => a.due.localeCompare(b.due)));

    const totalOutstanding = computed(() =>
      sorted.value.reduce((s, x) => s + x.amount, 0));

    return { items, form, addItem, removeItem, sorted, daysLeft, requestNotify, totalOutstanding, fmt };
  },
  template: `
    <div class="app-shell">
      <div class="page">
        <div class="topbar">
          <button class="topbar__back" type="button" @click="$router.back()">
            <span v-html="'${BackIcon}'"></span>
          </button>
          <div class="topbar__title">Credit Memo</div>
        </div>

        <div class="page-scroll">
          <div class="page-body">
            <div class="card">
              <div class="field">
                <label>Counterparty</label>
                <input v-model="form.name" type="text" placeholder="Who owes this amount">
              </div>
              <div class="field">
                <label>Amount</label>
                <input v-model="form.amount" type="number" inputmode="decimal" placeholder="0">
              </div>
              <div class="field">
                <label>Agreed repayment date</label>
                <input v-model="form.due" type="date">
              </div>
              <button class="btn btn--block" type="button" @click="addItem">Save memo</button>
              <button class="btn btn--ghost btn--block mt-3" type="button" @click="requestNotify">
                Enable in-app reminders
              </button>
            </div>

            <div class="tool-result">
              <div class="tool-result__row">
                <span>Open memos</span><b>{{ sorted.length }}</b>
              </div>
              <div class="tool-result__row">
                <span>Total outstanding</span><b>{{ fmt(totalOutstanding) }}</b>
              </div>
            </div>

            <div class="section-title">Outstanding</div>
            <div v-if="sorted.length === 0" class="empty">Nothing outstanding.</div>
            <div v-else class="card" style="padding:0">
              <div v-for="it in sorted" :key="it.id"
                   style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--c-border)">
                <div style="flex:1;min-width:0">
                  <div style="font-weight:700">{{ it.name }}</div>
                  <div class="hint">{{ fmt(it.amount) }} · Due {{ it.due }}</div>
                  <div class="hint" v-if="daysLeft(it.due) !== null">
                    <span v-if="daysLeft(it.due) < 0" class="up">Overdue by {{ -daysLeft(it.due) }} day(s)</span>
                    <span v-else-if="daysLeft(it.due) === 0" class="up">Due today</span>
                    <span v-else>{{ daysLeft(it.due) }} day(s) remaining</span>
                  </div>
                </div>
                <button class="btn btn--ghost" style="min-height:36px;padding:6px 12px;font-size:13px"
                        type="button" @click="removeItem(it.id)">Settle</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `
});

/* ==================================================================
   SETTINGS — Monthly Check-in
   ================================================================== */
const SettingsCheckinPage = defineComponent({
  setup(){
    const router = useRouter();
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const DOW = ['S','M','T','W','T','F','S'];

    const keyOf = d => year + '-' + String(month + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');

    const records = ref(storeGet('checkins_' + year + '_' + (month + 1), []));
    watch(records, v => storeSet('checkins_' + year + '_' + (month + 1), v));

    const todayKey = keyOf(today.getDate());
    const checkedToday = computed(() => records.value.includes(todayKey));

    const cells = computed(() => {
      const first = new Date(year, month, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevDays = new Date(year, month, 0).getDate();
      const out = [];
      for (let i = 0; i < startDow; i++) out.push({ day: prevDays - startDow + 1 + i, muted:true, key:'p'+i });
      for (let d = 1; d <= daysInMonth; d++) out.push({ day:d, muted:false, key:'c'+d });
      while (out.length % 7 !== 0) out.push({ day:0, muted:true, key:'n'+out.length });
      return out;
    });

    const doCheckin = () => {
      if (checkedToday.value){ showToast('Already checked in today'); return; }
      records.value = records.value.concat([todayKey]);
      showToast('Check-in successful');
    };

    return {
      MONTHS, DOW, year, month, cells, records, checkedToday, doCheckin, keyOf, router,
      monthLabel: MONTHS[month] + ' ' + year
    };
  },
  template: `
    <div class="app-shell">
      <div class="page">
        <div class="topbar">
          <button class="topbar__back" type="button" @click="router.back()">
            <span v-html="'${BackIcon}'"></span>
          </button>
          <div class="topbar__title">Monthly Check-in</div>
        </div>

        <div class="page-scroll">
          <div class="page-body">
            <div class="checkin-summary">
              <div class="checkin-summary__item">
                <b>{{ records.length }}</b><span>Days this month</span>
              </div>
              <div class="checkin-summary__item">
                <b>{{ checkedToday ? 'Yes' : 'No' }}</b><span>Checked in today</span>
              </div>
            </div>

            <div class="cal">
              <div class="cal__head" style="justify-content:center">
                <div class="cal__month">{{ monthLabel }}</div>
              </div>
              <div class="cal__grid">
                <div v-for="(d,i) in DOW" :key="'dow'+i" class="cal__dow">{{ d }}</div>
                <div v-for="c in cells" :key="c.key"
                     class="cal__cell"
                     :class="[c.muted ? 'cal__cell--muted' : '',
                              (!c.muted && records.includes(keyOf(c.day))) ? 'cal__cell--selected' : '']">
                  <span>{{ c.day || '' }}</span>
                </div>
              </div>
            </div>

            <button class="btn btn--block mt-4" type="button"
                    :disabled="checkedToday" @click="doCheckin">
              {{ checkedToday ? 'Checked in today' : 'Check in now' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  `
});

    const send = () => {
      if (!canSend.value) return;
      showToast('Feedback sent successfully');
      title.value = '';
      body.value = '';
      setTimeout(() => { router.back(); }, 400);
    };

    return { title, body, canSend, send, router };
  },
  template: `
    <div class="app-shell">
      <div class="page">
        <div class="topbar">
          <button class="topbar__back" type="button" @click="router.back()">
            <span v-html="'${BackIcon}'"></span>
          </button>
          <div class="topbar__title">Feedback</div>
        </div>

        <div class="page-scroll">
          <div class="page-body">
            <div class="card">
              <div class="field">
                <label>Title</label>
                <input v-model="title" type="text" placeholder="Summarize your feedback">
              </div>
              <div class="field" style="margin-bottom:0">
                <label>Message</label>
                <textarea v-model="body" placeholder="Tell us what you think"></textarea>
              </div>
            </div>

            <button class="btn btn--block mt-3" type="button" :disabled="!canSend" @click="send">
              Send feedback
            </button>
            <div class="hint mt-3">Both fields are required before sending.</div>
          </div>
        </div>
      </div>
    </div>
  `
});

/* ==================================================================
   SETTINGS — Inbox
   ================================================================== */
const SettingsInboxPage = defineComponent({
  setup(){

    const messages = ref(storeGet('inbox', [

    <div class="app-shell">

        <div class="page-scroll">
          <div class="page-body">
            <div class="setting-list">
              <button v-for="m in messages" :key="m.id" class="setting-row" type="button" @click="open(m)">

                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

                    <path d="M3 6h18v12H3z"/><polyline points="3 7 12 13 21 7"/>

                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 5 16 12 9 19"/>

                </span>
              </button>

          </div>
        </div>

        <transition name="fade">

      </div>

  `
});

/* ==================================================================
   ROUTER
   ================================================================== */
const routes = [
  { path:'/', redirect:'/loading' },
  { path:'/loading', name:'loading', component: LoadingPage },

  { path:'/home', name:'home', component: HomePage },
  { path:'/stock/:symbol', name:'stock', component: StockDetailPage },

  { path:'/rank/:kind', name:'rank', component: RankPage },
  { path:'/guide', name:'guide', component: GuidePage },

  { path:'/toolbox', name:'toolbox', component: ToolboxPage },
  { path:'/tool/dca', name:'tool-dca', component: ToolDcaPage },
  { path:'/tool/calendar', name:'tool-calendar', component: ToolWealthCalendarPage },
  { path:'/tool/loan', name:'tool-loan', component: ToolLoanPage },
  { path:'/tool/profit', name:'tool-profit', component: ToolProfitPage },
  { path:'/tool/reverse', name:'tool-reverse', component: ToolReversePage },
  { path:'/tool/password', name:'tool-password', component: ToolPasswordPage },
  { path:'/tool/credit', name:'tool-credit', component: ToolCreditPage },

  { path:'/settings', name:'settings', component: SettingsPage },
  { path:'/settings/version', name:'settings-version', component: SettingsVersionPage },
  { path:'/settings/privacy', name:'settings-privacy', component: SettingsPrivacyPage },
  { path:'/settings/terms', name:'settings-terms', component: SettingsTermsPage },
  { path:'/settings/team', name:'settings-team', component: SettingsTeamPage },
  { path:'/settings/checkin', name:'settings-checkin', component: SettingsCheckinPage },
  { path:'/settings/feedback', name:'settings-feedback', component: SettingsFeedbackPage },
  { path:'/settings/inbox', name:'settings-inbox', component: SettingsInboxPage },

  { path:'/:pathMatch(.*)*', redirect:'/home' }
];

const router = createRouter({
  history: createWebHashHistory(),
  routes,
  scrollBehavior(){ return { top:0 }; }
});

/* ==================================================================
   APP
   ================================================================== */
const App = defineComponent({
  setup(){
    return {};
  },
  template: `
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
    <Toast />
  `
});

const app = createApp(App);
app.use(router);
app.component('TabBar', TabBar);
app.component('Toast', Toast);
app.mount('#app');
</script>
