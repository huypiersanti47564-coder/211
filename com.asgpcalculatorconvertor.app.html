<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PSCI Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2/src/md5.min.js"></script>
  <style>
    /* ============================================================
       CSS Variables / Theme — Flat Design (Style #1)
       ============================================================ */
    :root {
      --color-primary: #1A73E8;
      --color-primary-light: #E8F0FE;
      --color-bg: #F5F7FA;
      --color-surface: #FFFFFF;
      --color-text: #1F2937;
      --color-text-secondary: #6B7280;
      --color-text-muted: #9CA3AF;
      --color-up: #E8711A;
      --color-down: #0B7A8E;
      --color-border: #E5E7EB;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.06);
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --tab-height: 56px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      height: 100%;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: var(--color-bg);
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
    }

    /* ============================================================
       Page Layout
       ============================================================ */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
      overflow: hidden;
    }

    .page-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 16px);
    }

    .page-scroll.no-tab {
      padding-bottom: 16px;
    }

    .page-header {
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 17px;
      font-weight: 600;
      flex: 1;
      text-align: center;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 50%;
      color: var(--color-text);
      flex-shrink: 0;
    }
    .back-btn:active { background: var(--color-primary-light); }

    /* ============================================================
       Tab Bar
       ============================================================ */
    .tab-bar {
      display: flex;
      height: var(--tab-height);
      padding-bottom: var(--safe-bottom);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--color-text-muted);
      font-size: 10px;
      font-weight: 500;
      transition: color 0.2s;
      min-height: 44px;
      -webkit-user-select: none;
      user-select: none;
    }

    .tab-item.router-link-active {
      color: var(--color-primary);
    }

    .tab-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .tab-item.router-link-active svg {
      stroke: var(--color-primary);
    }

    /* ============================================================
       Transition
       ============================================================ */
    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.2s ease;
    }
    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }
    .slide-enter-active,
    .slide-leave-active {
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .slide-enter-from {
      transform: translateX(30px);
      opacity: 0;
    }
    .slide-leave-to {
      transform: translateX(-30px);
      opacity: 0;
    }

    /* ============================================================
       Loading Page
       ============================================================ */
    .loading-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--color-surface);
      gap: 24px;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 15px;
      color: var(--color-text-secondary);
      font-weight: 500;
    }

    .loading-brand {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.5px;
    }

    /* ============================================================
       Home Page
       ============================================================ */
    .home-brand {
      padding: calc(20px + var(--safe-top)) 16px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .home-brand h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.5px;
    }

    .home-brand p {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
    }

    .quick-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-text);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-height: 100px;
      justify-content: center;
    }

    .quick-card:active {
      transform: scale(0.97);
      box-shadow: var(--shadow-sm);
    }

    .quick-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary-light);
    }

    .quick-icon-wrap svg {
      width: 24px;
      height: 24px;
      stroke: var(--color-primary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quick-card span {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      padding: 8px 16px;
      color: var(--color-text);
    }

    .stock-list {
      padding: 0 16px;
    }

    .stock-row {
      display: flex;
      align-items: center;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 8px;
      gap: 12px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      text-decoration: none;
      color: var(--color-text);
      cursor: pointer;
      transition: background 0.15s;
      min-height: 60px;
    }
    .stock-row:active { background: var(--color-primary-light); }

    .stock-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--color-primary);
      flex-shrink: 0;
    }

    .stock-info {
      flex: 1;
      min-width: 0;
    }

    .stock-info .ticker {
      font-size: 14px;
      font-weight: 700;
    }

    .stock-info .company {
      font-size: 12px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .stock-price {
      text-align: right;
      flex-shrink: 0;
    }

    .stock-price .price {
      font-size: 14px;
      font-weight: 700;
    }

    .stock-price .change {
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
    }

    .change.up { color: var(--color-up); }
    .change.down { color: var(--color-down); }

    /* ============================================================
       Detail / Sub-pages
       ============================================================ */
    .detail-content {
      padding: 16px;
    }

    .detail-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      margin-bottom: 16px;
    }

    .detail-card h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .detail-card .sub {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .detail-price-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 12px;
    }

    .detail-price-row .big-price {
      font-size: 32px;
      font-weight: 700;
    }

    .detail-price-row .big-change {
      font-size: 16px;
      font-weight: 600;
    }

    .chart-wrap {
      margin-top: 16px;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
    }

    .chart-wrap h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--color-text-secondary);
    }

    .article-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      line-height: 1.7;
      font-size: 14px;
      color: var(--color-text);
    }
    .article-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .article-card p {
      margin-bottom: 10px;
      color: var(--color-text-secondary);
    }

    /* ============================================================
       Toolbox
       ============================================================ */
    .tool-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      margin-bottom: 12px;
    }

    .tool-card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      background: var(--color-bg);
      color: var(--color-text);
      outline: none;
      transition: border-color 0.2s;
      min-height: 44px;
    }
    .form-input:focus {
      border-color: var(--color-primary);
      background: var(--color-surface);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      min-height: 44px;
      transition: opacity 0.2s, background 0.2s;
      background: var(--color-primary);
      color: #fff;
    }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
    }

    .result-box {
      margin-top: 10px;
      padding: 12px;
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      font-size: 13px;
      line-height: 1.6;
    }
    .result-box strong { color: var(--color-text); }
    .result-box span { color: var(--color-text-secondary); }

    /* Calendar */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .cal-header button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      color: var(--color-primary);
      min-width: 44px;
      min-height: 44px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }
    .cal-grid .day-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
      padding: 4px 0;
    }
    .cal-cell {
      font-size: 13px;
      padding: 6px 0;
      border-radius: 6px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cal-cell.today {
      background: var(--color-primary-light);
      font-weight: 700;
      color: var(--color-primary);
    }
    .cal-cell.has-event::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-up);
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Password strength */
    .strength-bar {
      height: 6px;
      border-radius: 3px;
      background: var(--color-border);
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s, background 0.3s;
    }

    /* Settings */
    .settings-list {
      padding: 16px;
    }
    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      text-decoration: none;
      color: var(--color-text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      min-height: 48px;
      transition: background 0.15s;
    }
    .settings-item:active { background: var(--color-primary-light); }
    .settings-item .arrow { color: var(--color-text-muted); font-size: 16px; }

    /* Check-in */
    .checkin-btn {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      margin-top: 16px;
    }
    .checkin-btn:disabled {
      background: var(--color-border);
      color: var(--color-text-muted);
      cursor: not-allowed;
    }

    /* Feedback */
    .feedback-form {
      padding: 16px;
    }
    .feedback-form textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
    }

    /* Inbox */
    .inbox-item {
      display: flex;
      align-items: center;
      padding: 16px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      cursor: pointer;
      min-height: 48px;
    }
    .inbox-item .title {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }
    .inbox-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
      flex-shrink: 0;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .modal-box {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 340px;
      width: 100%;
      box-shadow: var(--shadow-md);
    }
    .modal-box h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .modal-box p {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .modal-close {
      width: 100%;
      padding: 12px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(31, 41, 55, 0.92);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      pointer-events: none;
      white-space: nowrap;
      animation: toastIn 0.25s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Empty / misc */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--color-text-muted);
      font-size: 14px;
    }

    .content-pad { padding: 16px; }
  </style>
</head>
<body>
<div id="app">
  <router-view v-slot="{ Component }">
    <transition name="slide" mode="out-in">
      <component :is="Component" />
    </transition>
  </router-view>

  <!-- Tab Bar (shown only on Home / Toolbox / Settings) -->
  <nav class="tab-bar" v-if="showTab">
    <router-link to="/" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </router-link>
    <router-link to="/toolbox" class="tab-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Toolbox</span>
    </router-link>
    <router-link to="/settings" class="tab-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </router-link>
  </nav>

  <!-- Global Toast -->
  <div class="toast" v-if="toastMsg">{{ toastMsg }}</div>
</div>

<script>
/* ============================================================
   App entry point
   How to add a new page:
     1. Add a route object to `routes` array below.
     2. Define the component (or inline it) and reference it.
     3. If it needs a tab, add a <router-link> in the tab bar template.
   ============================================================ */

/* ---------- Stock data (20+ built-in US stocks) ---------- */
const STOCKS = [
  { ticker: 'AAPL', name: 'Apple Inc.', price: 189.25, change: 1.45 },
  { ticker: 'MSFT', name: 'Microsoft Corp.', price: 421.80, change: 0.82 },
  { ticker: 'GOOGL', name: 'Alphabet Inc.', price: 158.40, change: -0.65 },
  { ticker: 'AMZN', name: 'Amazon.com Inc.', price: 203.15, change: 1.12 },
  { ticker: 'NVDA', name: 'NVIDIA Corp.', price: 128.75, change: 2.38 },
  { ticker: 'META', name: 'Meta Platforms', price: 512.30, change: -1.20 },
  { ticker: 'TSLA', name: 'Tesla Inc.', price: 248.90, change: 3.15 },

/* ---------- Helper: generate random price history ---------- */
function genHistory(base, days) {
  const pts = [];
  let p = base;
  for (let i = 0; i < days; i++) {
    p += (Math.random() - 0.48) * base * 0.02;
    if (p < base * 0.7) p = base * 0.7;
    if (p > base * 1.3) p = base * 1.3;
    pts.push(p);
  }
  pts[pts.length - 1] = base;
  return pts;
}

/* ---------- Helper: shuffle (display only) ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Helper: pick random N ---------- */
function pickRandom(arr, n) {
  return shuffle(arr).slice(0, n);
}

              <!-- y-axis labels -->
              <text x="0" y="14" font-size="9" fill="#9CA3AF">\${{ maxY.toFixed(0) }}</text>
              <text x="0" y="150" font-size="9" fill="#9CA3AF">\${{ minY.toFixed(0) }}</text>
              <!-- grid lines -->
              <line x1="30" y1="10" x2="315" y2="10" stroke="#E5E7EB" stroke-width="0.5"/>
              <line x1="30" y1="80" x2="315" y2="80" stroke="#E5E7EB" stroke-width="0.5"/>
              <line x1="30" y1="150" x2="315" y2="150" stroke="#E5E7EB" stroke-width="0.5"/>
              <!-- area -->
              <polygon :points="areaPoints" fill="url(#gradArea)" opacity="0.25"/>
              <!-- line -->
              <polyline :points="linePoints" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
              <!-- gradient def -->
              <defs>
                <linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1A73E8"/>
                  <stop offset="100%" stop-color="#1A73E8" stop-opacity="0"/>
                </linearGradient>
              </defs>
            </svg>
          </div>

          <div class="detail-card">
            <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--color-text-secondary)">
              <div><strong style="color:var(--color-text)">Open</strong><br>\${{ (stock.price * 0.99).toFixed(2) }}</div>
              <div><strong style="color:var(--color-text)">High</strong><br>\${{ (stock.price * 1.02).toFixed(2) }}</div>
              <div><strong style="color:var(--color-text)">Low</strong><br>\${{ (stock.price * 0.97).toFixed(2) }}</div>
              <div><strong style="color:var(--color-text)">Vol</strong><br>12.4M</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `,
  setup() {
    const route = VueRouter.useRoute();
    const ticker = route.params.ticker;
    const stock = STOCKS.find(s => s.ticker === ticker) || STOCKS[0];

    const history = Vue.ref(genHistory(stock.price, 30));
    const data = history.value;
    const minRaw = Math.min(...data);
    const maxRaw = Math.max(...data);
    const pad = (maxRaw - minRaw) * 0.15 || 1;
    const minY = minRaw - pad;
    const maxY = maxRaw + pad;

    const chartLeft = 30, chartRight = 315, chartTop = 10, chartBottom = 150;
    const chartW = chartRight - chartLeft;
    const chartH = chartBottom - chartTop;

    const pts = data.map((v, i) => {
      const x = chartLeft + (i / (data.length - 1)) * chartW;
      const y = chartBottom - ((v - minY) / (maxY - minY)) * chartH;
      return { x, y };
    });

    const linePoints = pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const areaPoints = linePoints + ' ' + chartRight + ',' + chartBottom + ' ' + chartLeft + ',' + chartBottom;

    return { stock, minY, maxY, linePoints, areaPoints };
  }
};

    const dca = Vue.reactive({ cost: null, shares: null, threshold: null });
    const dcaResult = Vue.computed(() => {
      if (!dca.cost || !dca.shares || dca.threshold === null) return null;
      const target = dca.cost * (1 + dca.threshold / 100);
      return { target, hit: false };
    });

    /* ---- Wealth Calendar ---- */
    const now = new Date();
    const calYear = Vue.ref(now.getFullYear());
    const calMonth = Vue.ref(now.getMonth());
    const calEvents = Vue.ref([]);
    const calEvent = Vue.reactive({ label: '', date: '' });

    const calLabel = Vue.computed(() => {
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return months[calMonth.value] + ' ' + calYear.value;
    });

    const calCells = Vue.computed(() => {
      const first = new Date(calYear.value, calMonth.value, 1).getDay();
      const daysInMonth = new Date(calYear.value, calMonth.value + 1, 0).getDate();
      const today = new Date();
      const cells = [];
      for (let i = 0; i < first; i++) cells.push({ day: '', isToday: false, hasEvent: false });
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = calYear.value + '-' + String(calMonth.value + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const isToday = today.getFullYear() === calYear.value && today.getMonth() === calMonth.value && today.getDate() === d;
        const hasEvent = calEvents.value.some(e => e.date === dateStr);
        cells.push({ day: d, isToday, hasEvent });
      }
      return cells;
    });

    function calPrev() {
      if (calMonth.value === 0) { calMonth.value = 11; calYear.value--; }
      else calMonth.value--;
    }
    function calNext() {
      if (calMonth.value === 11) { calMonth.value = 0; calYear.value++; }
      else calMonth.value++;
    }
    function addCalEvent() {
      if (!calEvent.label || !calEvent.date) return;
      calEvents.value.push({ label: calEvent.label, date: calEvent.date });
      calEvent.label = ''; calEvent.date = '';
    }

    /* ---- Loan ---- */
    const loan = Vue.reactive({ amount: null, rate: null, months: null, method: 'equal' });
    const loanResult = Vue.computed(() => {
      const A = loan.amount, r = (loan.rate || 0) / 100 / 12, n = loan.months;
      if (!A || !n) return null;
      if (loan.method === 'equal') {
        let monthly;
        if (r === 0) monthly = A / n;
        else monthly = A * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
        const total = monthly * n;
        const interest = total - A;
        return [
          'Monthly Payment: $' + monthly.toFixed(2),
          'Total Payment: $' + total.toFixed(2),
          'Total Interest: $' + interest.toFixed(2)
        ];
      } else {
        const principalMonthly = A / n;
        let totalInterest = 0;
        const rows = [];
        for (let i = 0; i < Math.min(n, 12); i++) {
          const rem = A - principalMonthly * i;
          const int = rem * r;
          totalInterest += int;
          rows.push('Month ' + (i+1) + ': $' + (principalMonthly + int).toFixed(2));
        }
        for (let i = 12; i < n; i++) {
          const rem = A - principalMonthly * i;
          totalInterest += rem * r;
        }
        return [
          'Monthly Principal: $' + principalMonthly.toFixed(2),
          ...rows.slice(0, 5),
          '...',
          'Total Interest: $' + totalInterest.toFixed(2)
        ];
      }
    });

    /* ---- Profit ---- */
    const profit = Vue.reactive({ cost: null, price: null, qty: null });
    const profitResult = Vue.computed(() => {
      const c = profit.cost, p = profit.price, q = profit.qty;
      if (c === null || p === null || !q) return null;
      return { rev: p * q, cost: c * q, net: (p - c) * q };
    });

    /* ---- Reverse Yield ---- */
    const ry = Vue.reactive({ target: null, principal: null, years: null });
    const ryResult = Vue.computed(() => {
      if (!ry.target || !ry.principal || !ry.years) return null;
      return (Math.pow((ry.principal + ry.target) / ry.principal, 1 / ry.years) - 1) * 100;
    });

    /* ---- Password ---- */
    const pwd = Vue.ref('');
    const pwdMd5 = Vue.computed(() => pwd.value ? md5(pwd.value) : '');
    const pwdStrength = Vue.computed(() => {
      const p = pwd.value;
      let score = 0;
      if (p.length >= 8) score++;
      if (p.length >= 12) score++;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
      if (/\d/.test(p)) score++;
      if (/[^a-zA-Z0-9]/.test(p)) score++;
      if (score <= 1) return { pct: 20, color: '#EF4444', label: 'Weak' };
      if (score === 2) return { pct: 40, color: '#F59E0B', label: 'Fair' };
      if (score === 3) return { pct: 60, color: '#3B82F6', label: 'Good' };
      if (score === 4) return { pct: 80, color: '#10B981', label: 'Strong' };
      return { pct: 100, color: '#059669', label: 'Very Strong' };
    });

    /* ---- Credit ---- */
    const credit = Vue.reactive({ name: '', amount: null, dueDate: '' });
    const credits = Vue.ref([]);
    function addCredit() {
      if (!credit.name || !credit.amount || !credit.dueDate) return;
      credits.value.push({ name: credit.name, amount: credit.amount, dueDate: credit.dueDate });
      credit.name = ''; credit.amount = null; credit.dueDate = '';
    }
    function daysUntil(dateStr) {
      const now = new Date(); now.setHours(0,0,0,0);
      const due = new Date(dateStr + 'T00:00:00');
      return Math.ceil((due - now) / (1000 * 60 * 60 * 24));
    }

    return {
      dca, dcaResult,
      calLabel, calCells, calPrev, calNext, calEvent, calEvents, addCalEvent,
      loan, loanResult,
      profit, profitResult,
      ry, ryResult,
      pwd, pwdMd5, pwdStrength,
      credit, credits, addCredit, daysUntil
    };
  }
};

const CheckinPage = {
  template: `
    <div class="page">
      <div class="page-header">
        <button class="back-btn" @click="$router.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1>Monthly Check-in</h1><div style="width:44px"></div>
      </div>
      <div class="page-scroll no-tab">
        <div class="content-pad">
          <div class="tool-card">
            <h3 style="text-align:center;margin-bottom:16px">{{ monthLabel }}</h3>
            <div class="cal-grid">
              <div class="day-label" v-for="d in ['Su','Mo','Tu','We','Th','Fr','Sa']" :key="d">{{ d }}</div>
              <div v-for="(c, i) in cells" :key="i" class="cal-cell" :class="{today: c.isToday, 'has-event': c.checked}">{{ c.day || '' }}</div>
            </div>
            <button class="checkin-btn" :disabled="checkedToday" @click="doCheckin">
              {{ checkedToday ? 'Checked In Today' : 'Check In' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  `,
  setup() {
    const now = new Date();
    const monthLabel = (now.getMonth() + 1) + ' / ' + now.getFullYear();
    const storeKey = 'psci_checkin_' + now.getFullYear() + '_' + now.getMonth();
    const checkedDates = Vue.ref(JSON.parse(localStorage.getItem(storeKey) || '[]'));
    const todayStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
    const checkedToday = Vue.ref(checkedDates.value.includes(todayStr));

    const cells = Vue.computed(() => {
      const first = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const arr = [];
      for (let i = 0; i < first; i++) arr.push({ day: '', isToday: false, checked: false });
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + d;
        arr.push({ day: d, isToday: d === now.getDate(), checked: checkedDates.value.includes(dateStr) });
      }
      return arr;
    });

    function doCheckin() {
      if (checkedToday.value) return;
      checkedDates.value.push(todayStr);
      localStorage.setItem(storeKey, JSON.stringify(checkedDates.value));
      checkedToday.value = true;
      window.__toast('Check-in successful!');
    }

    return { monthLabel, cells, checkedToday, doCheckin };
  }
};

  { path: '/', component: HomePage },
  { path: '/loading', component: LoadingPage },
  { path: '/stock/:ticker', component: StockDetailPage },
  { path: '/sub/gainers', component: SubRankingPage, props: { title: 'Top Gainers', count: 10 } },
  { path: '/sub/losers', component: SubRankingPage, props: { title: 'Top Losers', count: 5 } },

  { path: '/sub/picks', component: SubRankingPage, props: { title: "Today's Picks", count: 10 } },
  { path: '/sub/notrec', component: SubRankingPage, props: { title: 'Not Recommended', count: 10 } },
  { path: '/sub/watchlist', component: SubRankingPage, props: { title: 'Watchlist', count: 10 } },

  { path: '/settings/version', component: VersionPage },
  { path: '/settings/privacy', component: PrivacyPage },
  { path: '/settings/terms', component: TermsPage },
  { path: '/settings/team', component: TeamPage },
  { path: '/settings/checkin', component: CheckinPage },
  { path: '/settings/feedback', component: FeedbackPage },
  { path: '/settings/inbox', component: InboxPage }
];

const router = VueRouter.createRouter({
  history: VueRouter.createWebHashHistory(),
  routes
});

/* Redirect to loading on first launch */
router.beforeEach((to, from) => {
  if (to.path === '/' && from.path === '/') {
    return '/loading';
  }
});

const App = {
  setup() {
    const route = VueRouter.useRoute();
    const showTab = Vue.computed(() => {
      const p = route.path;
      return p === '/' || p === '/toolbox' || p === '/settings';
    });

    const toastMsg = Vue.ref('');
    let toastTimer = null;
    window.__toast = (msg) => {
      toastMsg.value = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastMsg.value = ''; }, 2200);
    };

    return { showTab, toastMsg };
  }
};
